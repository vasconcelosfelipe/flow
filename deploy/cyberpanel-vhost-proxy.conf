# Trecho adicionado a /usr/local/lsws/conf/vhosts/flow.soduscore.com/vhost.conf
# na VPS real (OVH, CyberPanel + OpenLiteSpeed).
#
# Esta VPS já hospeda outros sites e serviços — o CyberPanel criou o vhost,
# o domínio e o certificado Let's Encrypt antes deste deploy. Por isso não
# há nginx nem certbot próprios do projeto: em vez de servir PHP do
# `public_html`, o vhost aponta para o container Docker do Next.js via
# proxy reverso, na porta 3050 (127.0.0.1, nunca exposta ao mundo).
#
# O bloco `context /.well-known/acme-challenge` original do CyberPanel foi
# mantido intacto — a renovação automática do certificado depende dele.

extprocessor flowproxy {
  type                    proxy
  address                 127.0.0.1:3050
  maxConns                100
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

context / {
  type                    proxy
  handler                 flowproxy
  addDefaultCharset       off
}
